[package]
name = "sec-mcp"
version = "0.5.0"
edition = "2021"
# 1.88: rmcp 3 declares this as its own MSRV.
rust-version = "1.88"
authors = ["Stefan Ractliffe"]
description = "MCP server for SEC EDGAR data — company filings, financial concepts, and company info via Claude Desktop"
license = "MIT"
repository = "https://codeberg.org/brechanbech/sec-mcp"
homepage = "https://codeberg.org/brechanbech/sec-mcp"
readme = "README.md"
keywords = ["mcp", "sec", "edgar", "finance", "claude"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "sec-mcp"
path = "src/main.rs"

[dependencies]
# --- MCP ---
# The protocol layer (framing, negotiation, server/discover, resultType) is the
# SDK's; this crate supplies only the tool set. Previously hand-rolled.
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
schemars = "1"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "gzip", "http2", "system-proxy", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
anyhow = "1"
urlencoding = "2"
# Forms 3/4/5 are XML, not JSON. roxmltree is a read-only DOM whose only required
# dependency is `memchr`, already in the tree — so no new transitive deps on a
# crate that deliberately avoids build-time C.
roxmltree = "0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
dirs = "6"
